        <style>
        :root {
            --brand-1: #0b3d63;
            --brand-2: #1565a0;
            --brand-3: #2e9ec9;
            --accent:  #f0a735;
            --ink:     #16232e;
            --paper:   #ffffff;
            --shadow:  0 10px 30px rgba(11, 61, 99, 0.18);
            --shadow-sm: 0 4px 14px rgba(11, 61, 99, 0.14);
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* ============ HEADER / JUDUL ============ */
        #app-header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: min(760px, calc(100% - 110px));
            background: linear-gradient(135deg, rgba(11,61,99,0.96), rgba(21,101,160,0.94));
            color: #fff;
            border-radius: 16px;
            padding: 14px 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.16);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform .3s ease, opacity .3s ease;
        }
        #app-header .brand-icon {
            flex: 0 0 auto;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--brand-3), var(--accent));
            display: grid;
            place-items: center;
            font-size: 22px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
        }
        #app-header .brand-text { min-width: 0; }
        #app-header .eyebrow {
            font-size: 10.5px;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.82;
            margin-bottom: 2px;
        }
        #app-header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 17px;
            line-height: 1.28;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.1px;
        }
        #app-header h1 .hl { color: #ffd68a; }
        #header-toggle {
            position: absolute;
            top: 50%;
            right: -13px;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #16232e;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
            display: grid;
            place-items: center;
        }
        #app-header.collapsed { transform: translateX(-50%) translateY(-120%); opacity: 0; }
        #header-reveal {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--brand-1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: none;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
        }

        /* ============ KONTROL LEAFLET ============ */
        .leaflet-bar,
        .leaflet-control-layers,
        .leaflet-control-geocoder,
        .leaflet-control-measure,
        .leaflet-control-locate a {
            border: none !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow-sm) !important;
            overflow: hidden;
        }
        .leaflet-bar a,
        .leaflet-control-locate a {
            background: #fff;
            color: var(--brand-1);
            width: 34px;
            height: 34px;
            line-height: 34px;
            transition: background .15s ease, color .15s ease;
        }
        .leaflet-bar a:hover,
        .leaflet-control-locate a:hover { background: var(--brand-2); color: #fff; }
        .leaflet-touch .leaflet-bar a:first-child { border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .leaflet-touch .leaflet-bar a:last-child { border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }

        /* ============ PANEL LAYER TREE ============ */
        .leaflet-control-layers {
            padding: 0 !important;
            background: #fff;
            max-height: 80vh;
            overflow: hidden;
        }
        .leaflet-control-layers-toggle {
            width: 40px !important;
            height: 40px !important;
            background-color: #fff;
            background-size: 22px 22px;
        }
        .leaflet-control-layers-expanded {
            padding: 0 !important;
            width: 300px;
        }
        .leaflet-control-layers-expanded::before {
            content: "Daftar Layer";
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            padding: 11px 15px;
            letter-spacing: 0.3px;
        }
        .leaflet-control-layers-list {
            padding: 8px 12px 12px;
            max-height: calc(80vh - 44px);
            overflow-y: auto;
        }
        .leaflet-control-layers-list::-webkit-scrollbar { width: 7px; }
        .leaflet-control-layers-list::-webkit-scrollbar-thumb { background: #c3d4e0; border-radius: 4px; }
        .leaflet-layerstree-node { margin: 1px 0; }
        .leaflet-layerstree-header { padding: 3px 0; font-size: 12.5px; color: var(--ink); }
        .leaflet-layerstree-header-name { font-weight: 500; }
        .leaflet-layerstree-header-name b { color: var(--brand-1); font-family: 'Plus Jakarta Sans', sans-serif; }
        .leaflet-layerstree-children { padding-left: 14px; border-left: 2px solid #eef3f7; margin-left: 4px; }
        .leaflet-control-layers label { font-size: 12px; line-height: 1.4; }
        .leaflet-control-layers img { vertical-align: middle; border-radius: 2px; }
        .leaflet-control-layers table { font-size: 11px; }
        .leaflet-control-layers input[type="checkbox"],
        .leaflet-control-layers input[type="radio"] { accent-color: var(--brand-2); transform: scale(1.05); }
        .leaflet-layerstree-header-pointer { color: var(--brand-2); font-weight: 700; }

        /* ============ ABSTRACT / SUMBER DATA ============ */
        .leaflet-control.abstract,
        .leaflet-control.abstractUncollapsed,
        #abstract {
            background: rgba(255,255,255,0.94) !important;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(11,61,99,0.10) !important;
            border-left: 4px solid var(--accent) !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow-sm) !important;
            padding: 12px 15px !important;
            max-width: 300px;
            font-family: 'Inter', sans-serif !important;
            font-size: 11.5px !important;
            line-height: 1.6 !important;
            color: var(--ink) !important;
            margin: 0 0 12px 12px !important;
        }
        #abstract::before {
            content: "\f05a  Keterangan Peta";
            font-family: 'FontAwesome', 'Plus Jakarta Sans', sans-serif;
            display: block;
            font-weight: 700;
            font-size: 12px;
            color: var(--brand-1);
            margin-bottom: 6px;
            letter-spacing: .3px;
        }

        /* ============ POPUP ============ */
        .leaflet-popup-content-wrapper {
            border-radius: 14px !important;
            box-shadow: var(--shadow) !important;
            padding: 2px;
        }
        .leaflet-popup-content {
            margin: 14px 16px !important;
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            color: var(--ink);
        }
        .leaflet-popup-content table { width: 100%; border-collapse: collapse; }
        .leaflet-popup-content th {
            text-align: left;
            padding: 6px 10px 6px 0;
            color: var(--brand-2);
            font-weight: 600;
            border-bottom: 1px solid #eef3f7;
            white-space: nowrap;
            vertical-align: top;
        }
        .leaflet-popup-content td {
            padding: 6px 0;
            border-bottom: 1px solid #eef3f7;
            font-weight: 500;
        }
        .leaflet-popup-content tr:last-child th,
        .leaflet-popup-content tr:last-child td { border-bottom: none; }
        .leaflet-popup-tip { box-shadow: var(--shadow) !important; }

        /* ============ ATRIBUSI ============ */
        .leaflet-control-attribution {
            background: rgba(255,255,255,0.86) !important;
            border-radius: 8px 0 0 0;
            font-size: 10px;
            padding: 3px 8px;
        }

        /* ============ GEOCODER ============ */
        .leaflet-control-geocoder-form input {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            height: 34px;
        }

        /* ============ RESPONSIF ============ */
        @media (max-width: 640px) {
            #app-header { padding: 11px 16px; gap: 10px; width: calc(100% - 90px); }
            #app-header .brand-icon { width: 38px; height: 38px; font-size: 18px; }
            #app-header h1 { font-size: 13.5px; }
            #app-header .eyebrow { font-size: 9px; letter-spacing: 1.6px; }
            #abstract { max-width: 210px; font-size: 10.5px !important; }
        }

        <script>
        var map = L.map('map', {
            zoomControl:true, maxZoom:28, minZoom:1
        }).fitBounds([[-9.684738155593942,116.15146998201791],[-7.708853778653173,118.56434478201723]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        document.querySelector(".leaflet-popup-pane").addEventListener("load", function(event) {
          var tagName = event.target.tagName,
            popup = map._popup;
          // Also check if flag is already set.
          if (tagName === "IMG" && popup && !popup._updated) {
            popup._updated = true; // Set flag to prevent looping.
            popup.update();
          }
        }, true);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0]
        .innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0]
        .className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GmapsSattelite_0');
        map.getPane('pane_GmapsSattelite_0').style.zIndex = 400;
        var layer_GmapsSattelite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GmapsSattelite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 22
        });
        layer_GmapsSattelite_0;
        map.addLayer(layer_GmapsSattelite_0);

            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Sumber Pencemar</th>\
                        <td class="visible-with-data" id="Keterangan">' + (feature.properties['Keterangan'] !== null ? autolinker.link(feature.properties['Keterangan'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Luas_Ha</th>\
                        <td class="visible-with-data" id="Luas_Ha">' + (feature.properties['Luas_Ha'] !== null ? autolinker.link(feature.properties['Luas_Ha'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
            var popup = layer.getPopup();
            var content = popup.getContent();
            var updatedContent = removeEmptyRowsFromPopupContent(content, feature);
            popup.setContent(updatedContent);
        }

        function style_Sumber_Pencemar_1_0(feature) {
            switch(String(feature.properties['Keterangan'])) {
                case 'Bendung':
                    return {

                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(182,216,130,1.0)',
                interactive: true,
            }
                    break;
                case 'Embung':
                    return {

                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(136,87,209,1.0)',
                interactive: true,
            }
                    break;
                case 'Lahan Pertanian':
                    return {
                pane: 'pane_Sumber_Pencemar_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(221,148,22,1.0)',

            }
                    break;
                case 'Pembukaan Lahan':

                weight: 1.0,

                    break;

                opacity: 1,
                color: 'rgba(35,35,35,1.0)',

                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(71,120,211,1.0)',

            }
                    break;
                case 'Permukiman':

                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',

                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(235,49,207,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Sumber_Pencemar_1');
        map.getPane('pane_Sumber_Pencemar_1').style.zIndex = 401;

        var layer_Sumber_Pencemar_1 = new L.geoJson(json_Sumber_Pencemar_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Sumber_Pencemar_1',
            layerName: 'layer_Sumber_Pencemar_1',
            pane: 'pane_Sumber_Pencemar_1',

            style: style_Sumber_Pencemar_1_0,

        map.addLayer(layer_Sumber_Pencemar_1);

        setBounds();
        </script>
